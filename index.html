<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Palm Estates — Dubai Property Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="navbar" class="navbar">
  <div class="nav-inner">
    <button class="brand" onclick="navigate('home')">
      <span class="brand-mark"></span>
      Palm Estates
    </button>
    <nav class="nav-links">
      <div class="nav-drop">
        <button class="nav-link">Buy <svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="nav-drop-panel" id="nav-cats"></div>
      </div>
      <button class="nav-link" onclick="navigate('search')">Explore</button>
      <button class="nav-link" onclick="navigate('mylistings')">My listings</button>
    </nav>
    <div class="nav-actions">
      <button class="btn btn-primary btn-nav" onclick="navigate('post')">List your property</button>
      <button class="kebab" onclick="openMainMenu()" aria-label="Menu">⋮</button>
    </div>
  </div>
</header>

<main id="view-root"></main>

<footer class="site-footer" id="site-footer"></footer>

<div id="sheet-overlay" class="overlay"></div>
<div id="sheet" class="sheet"></div>
<div id="modal-root"></div>
<div id="toast"></div>

<script src="script.js"></script>
</body>
</html>
